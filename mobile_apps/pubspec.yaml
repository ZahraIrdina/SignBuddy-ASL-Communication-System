name: signbuddy
description: Smart Two-Way Communication App between Deaf-Mute and Hearing People.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  translator: ^1.0.3+1
  cupertino_icons: ^1.0.8
  camera: ^0.11.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  hand_landmarker: 1.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/models/
    - assets/signs_images/
    - assets/signs_videos/